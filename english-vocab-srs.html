<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexicon — nauka słówek</title>
<style>
  :root{
    --bg:#1C2128;
    --panel:#262C33;
    --panel-2:#2F3640;
    --paper:#F3EEE1;
    --paper-ink:#2B2620;
    --text:#E7E3D8;
    --text-dim:#9AA0A6;
    --border:#3A4149;
    --moss:#7A9B76;
    --amber:#E3A857;
    --rust:#C1563D;
    --sky:#6C93B0;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:760px;margin:0 auto;padding:20px 18px 60px;}

  /* Topbar */
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-end;
    flex-wrap:wrap;gap:10px;
    padding-bottom:16px;border-bottom:1px solid var(--border);
    margin-bottom:18px;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand-mark{
    font-family:var(--font-display);font-size:28px;color:var(--amber);
    font-style:italic;
  }
  .brand h1{font-family:var(--font-display);font-size:22px;margin:0;font-weight:400;letter-spacing:.2px;}
  .brand-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;}
  .stats-pill{
    font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
    background:var(--panel);border:1px solid var(--border);border-radius:999px;
    padding:6px 14px;
  }
  .stats-pill strong{color:var(--amber);font-weight:600;}

  /* Tabs */
  .tabs{display:flex;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--border);}
  .tab{
    background:none;border:none;color:var(--text-dim);font-family:var(--font-sans);
    font-size:14px;padding:9px 4px;margin-right:20px;cursor:pointer;
    border-bottom:2px solid transparent;transition:color .15s, border-color .15s;
  }
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--text);border-bottom-color:var(--amber);}

  section[hidden]{display:none;}

  /* Empty state */
  .empty{
    text-align:center;padding:50px 20px;color:var(--text-dim);
    border:1px dashed var(--border);border-radius:10px;
  }
  .empty p{margin:0 0 14px;font-size:14px;}

  /* Today tab */
  .today-hero{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:22px;margin-bottom:18px;
  }
  .today-hero h2{font-family:var(--font-display);font-weight:400;font-size:20px;margin:0 0 4px;}
  .today-hero .sub{color:var(--text-dim);font-size:13px;margin-bottom:16px;}
  .cta-row{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{
    font-family:var(--font-sans);font-size:14px;font-weight:600;
    padding:10px 18px;border-radius:8px;border:1px solid transparent;
    cursor:pointer;transition:transform .1s, filter .15s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--amber);color:#241B0D;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-secondary{background:transparent;border-color:var(--border);color:var(--text);}
  .btn-secondary:hover{border-color:var(--text-dim);}
  .btn-ghost{background:none;border:none;color:var(--sky);font-size:13px;cursor:pointer;padding:4px 0;}
  .btn-danger{background:transparent;border:1px solid var(--rust);color:var(--rust);}

  .due-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .chip{
    font-family:var(--font-mono);font-size:12px;background:var(--panel-2);
    border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--text-dim);
  }

  .curve-note{
    font-size:12px;color:var(--text-dim);line-height:1.6;padding:14px 16px;
    background:var(--panel-2);border-radius:8px;border-left:2px solid var(--sky);
    margin-top:8px;
  }

  /* Review stage */
  .review-stage{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:26px 20px;}
  .review-progress{
    font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
    display:flex;justify-content:space-between;margin-bottom:18px;
  }
  .review-progress button{background:none;border:none;color:var(--text-dim);cursor:pointer;font-family:var(--font-mono);font-size:12px;}
  .review-progress button:hover{color:var(--rust);}

  .flashcard{
    background:var(--paper);color:var(--paper-ink);border-radius:10px;
    min-height:220px;display:flex;flex-direction:column;justify-content:center;
    align-items:center;text-align:center;padding:30px 20px;cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    position:relative;
  }
  .card-lang{font-family:var(--font-mono);font-size:11px;letter-spacing:.15em;color:#8a8272;position:absolute;top:16px;left:18px;}
  .card-word{font-family:var(--font-display);font-size:30px;margin-top:6px;}
  .card-hint{font-size:12px;color:#8a8272;margin-top:18px;font-family:var(--font-mono);}
  .card-examples{margin-top:18px;text-align:left;width:100%;}
  .example-row{font-size:13px;margin-bottom:8px;line-height:1.5;}
  .example-context{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#8a8272;display:block;}

  .rate-row{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
  .rate{flex:1;min-width:70px;padding:12px 6px;border-radius:8px;border:none;cursor:pointer;font-family:var(--font-sans);font-weight:600;font-size:13px;color:#1a1a1a;}
  .rate span{display:block;font-family:var(--font-mono);font-weight:400;font-size:10px;margin-top:3px;opacity:.75;}
  .rate-again{background:var(--rust);color:#fff;}
  .rate-hard{background:var(--amber);}
  .rate-good{background:var(--moss);color:#fff;}
  .rate-easy{background:var(--sky);color:#fff;}

  /* Quiz */
  .quiz-lang{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);letter-spacing:.1em;text-align:center;}
  .quiz-word{font-family:var(--font-display);font-size:28px;text-align:center;margin:12px 0 22px;}
  .quiz-input-row{display:flex;gap:8px;}
  #quizInput{
    flex:1;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:12px 14px;border-radius:8px;font-size:15px;font-family:var(--font-sans);
  }
  #quizInput:focus{outline:none;border-color:var(--sky);}
  .quiz-feedback{margin-top:18px;padding:14px;border-radius:8px;font-size:14px;}
  .quiz-feedback.correct{background:rgba(122,155,118,.15);border:1px solid var(--moss);}
  .quiz-feedback.incorrect{background:rgba(193,86,61,.15);border:1px solid var(--rust);}
  .quiz-feedback .correct-answer{font-weight:600;margin-bottom:6px;}
  .quiz-examples{margin-top:8px;}

  .review-complete{text-align:center;padding:20px 0;}
  .review-complete h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin-bottom:6px;}
  .review-complete p{color:var(--text-dim);font-size:14px;margin-bottom:20px;}

  /* Words tab */
  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  #searchInput{
    flex:1;min-width:160px;background:var(--panel);border:1px solid var(--border);
    color:var(--text);padding:9px 12px;border-radius:8px;font-size:13px;font-family:var(--font-sans);
  }
  #searchInput:focus{outline:none;border-color:var(--sky);}

  .word-form{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:20px;}
  .word-form h3{font-family:var(--font-display);font-weight:400;margin:0 0 14px;font-size:17px;}
  .form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .form-row > div{flex:1;min-width:140px;}
  label{display:block;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:5px;}
  input[type=text], textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:9px 11px;border-radius:7px;font-size:13px;font-family:var(--font-sans);resize:vertical;
  }
  input[type=text]:focus, textarea:focus{outline:none;border-color:var(--sky);}
  .example-editor-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start;}
  .example-editor-row .ctx{width:150px;flex-shrink:0;}
  .example-editor-row .sent{flex:1;}
  .example-editor-row button{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;padding:6px;flex-shrink:0;}
  .example-editor-row button:hover{color:var(--rust);}
  .form-actions{display:flex;gap:10px;margin-top:14px;align-items:center;}

  .bulk-toggle{display:flex;gap:6px;margin-bottom:14px;}
  .bulk-toggle button{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);
    font-family:var(--font-sans);font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer;
  }
  .bulk-toggle button.active{background:var(--sky);color:#0e1a22;border-color:var(--sky);font-weight:600;}
  .bulk-preview{display:flex;flex-direction:column;gap:6px;margin-top:16px;max-height:340px;overflow-y:auto;}
  .bulk-row{
    display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);
    border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;
  }
  .bulk-row input[type=checkbox]{margin-top:3px;flex-shrink:0;}
  .bulk-row-body{flex:1;min-width:0;}
  .bulk-row .en{font-family:var(--font-display);font-size:14px;}
  .bulk-row .pl{color:var(--text-dim);font-family:var(--font-sans);font-size:13px;}
  .dup-flag{font-family:var(--font-mono);font-size:9px;color:var(--amber);text-transform:uppercase;}
  .bulk-examples{margin-top:5px;}
  .bulk-examples .example-row{font-size:12px;color:var(--text-dim);margin-bottom:3px;}

  .word-list{display:flex;flex-direction:column;gap:8px;}
  .word-row{
    background:var(--panel);border:1px solid var(--border);border-radius:9px;
    padding:12px 14px;display:flex;align-items:center;gap:14px;
  }
  .word-row .pair{flex:1;min-width:0;}
  .word-row .en{font-family:var(--font-display);font-size:16px;}
  .word-row .pl{color:var(--text-dim);font-size:13px;}
  .word-row .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
  .tag-mini{font-family:var(--font-mono);font-size:9px;background:var(--panel-2);color:var(--text-dim);padding:2px 6px;border-radius:4px;}
  .sparkline{display:block;}
  .due-badge{font-family:var(--font-mono);font-size:10px;padding:3px 8px;border-radius:5px;white-space:nowrap;}
  .due-overdue{background:rgba(193,86,61,.2);color:var(--rust);}
  .due-today{background:rgba(227,168,87,.2);color:var(--amber);}
  .due-soon{background:rgba(108,147,176,.2);color:var(--sky);}
  .due-future{background:var(--panel-2);color:var(--text-dim);}
  .row-actions{display:flex;gap:4px;}
  .icon-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;padding:5px;}
  .icon-btn:hover{color:var(--text);}

  /* Stats tab */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px;}
  .stat-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;}
  .stat-card .num{font-family:var(--font-display);font-size:26px;color:var(--amber);}
  .stat-card .label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-top:4px;}
  .panel-block{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;}
  .panel-block h3{font-family:var(--font-display);font-weight:400;font-size:15px;margin:0 0 10px;}
  .weak-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);}
  .weak-row:last-child{border-bottom:none;}
  .weak-row .ease{font-family:var(--font-mono);color:var(--text-dim);font-size:11px;}
  .danger-zone{border-color:var(--rust);}

  @media (max-width:480px){
    .brand h1{font-size:18px;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .word-row{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">§</span>
      <div>
        <h1>Lexicon</h1>
        <div class="brand-sub">powtórki rozłożone w czasie</div>
      </div>
    </div>
    <div class="stats-pill">Dziś do powtórki: <strong id="dueCountPill">0</strong> · Seria: <strong id="streakPill">0</strong> dni</div>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="today">Dziś</button>
    <button class="tab" data-tab="words">Słownik</button>
    <button class="tab" data-tab="stats">Statystyki</button>
  </nav>

  <main id="loadingState" class="empty"><p>Wczytywanie…</p></main>

  <section id="tab-today" hidden></section>
  <section id="tab-words" hidden></section>
  <section id="tab-stats" hidden></section>
</div>
<input type="file" id="importFileInput" accept="application/json,.json" style="display:none">

<script>
(function(){
  'use strict';
  const STORAGE_KEY = 'vocab-store';
  let state = null;
  let currentTab = 'today';
  let reviewQueue = [];
  let reviewIndex = 0;
  let reviewMode = null; // 'flashcard' | 'quiz'
  let cardFlipped = false;
  let currentQuizDirection = 'en-pl';
  let currentQuizAnswered = false;
  let editingWordId = null;

  // ---------- utils ----------
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function daysBetween(a,b){
    const d1 = new Date(a+'T00:00:00');
    const d2 = new Date(b+'T00:00:00');
    return Math.round((d2-d1)/86400000);
  }
  function addDaysISO(dateStr, days){
    const d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()+days);
    return d.toISOString().slice(0,10);
  }
  function randId(){ return 'w_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
  function normalize(str){
    return (str||'').trim().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^\w\s]/g,'').replace(/\s+/g,' ').trim();
  }
  function acceptableAnswers(str){
    return (str||'').split('/').map(normalize).filter(Boolean);
  }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- seed data ----------
  function makeWord(en, pl, examples){
    const today = todayISO();
    return {
      id: randId(), en, pl, examples: examples||[],
      created: today,
      srs: { repetitions:0, interval:0, ease:2.5, dueDate: today },
      history: []
    };
  }
  function seedWords(){
    return [
      makeWord('regression', 'regresja', [
        {context:'praca / IT', sentence:'We ran a full regression suite before the release.'},
        {context:'codzienne', sentence:'His symptoms went into regression after treatment.'}
      ]),
      makeWord('flaky test', 'niestabilny test', [
        {context:'praca / IT', sentence:'This flaky test fails randomly, not because of a real bug.'}
      ]),
      makeWord('edge case', 'przypadek brzegowy', [
        {context:'praca / IT', sentence:"Don't forget to check the edge case of an empty list."}
      ]),
      makeWord('deprecated', 'przestarzały / wycofany', [
        {context:'praca / IT', sentence:'This API method is deprecated and will be removed next year.'}
      ]),
      makeWord('assertion', 'asercja / stwierdzenie', [
        {context:'praca / IT', sentence:'The test failed because the assertion expected a different value.'},
        {context:'codzienne', sentence:'She made a bold assertion during the argument.'}
      ]),
      makeWord('rollback', 'wycofanie zmian', [
        {context:'praca / IT', sentence:'We had to do a rollback after the deployment broke production.'}
      ])
    ];
  }

  // ---------- storage ----------
  async function loadState(){
    try{
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if(raw){
        state = JSON.parse(raw);
      } else {
        state = { words: seedWords(), stats:{streak:0,lastStudyDate:null,totalReviews:0} };
        await saveState();
      }
    }catch(e){
      console.error('Load failed', e);
      state = { words: seedWords(), stats:{streak:0,lastStudyDate:null,totalReviews:0} };
      try{ await saveState(); }catch(e2){ console.error('Initial save failed', e2); }
    }
  }
  async function saveState(){
    try{
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ console.error('Storage error', e); }
  }
  async function requestPersistentStorage(){
    try{
      if(navigator.storage && navigator.storage.persist){
        await navigator.storage.persist();
      }
    }catch(e){ /* not critical — best effort */ }
  }

  // ---------- SRS ----------
  function dueWords(){
    const t = todayISO();
    return state.words.filter(w => w.srs.dueDate <= t);
  }
  function applyReview(word, quality){
    // quality: 0=Again 1=Hard 2=Good 3=Easy
    let {repetitions, interval, ease} = word.srs;
    if(quality === 0){
      repetitions = 0;
      interval = 1;
      ease = Math.max(1.3, ease - 0.2);
    } else {
      if(repetitions === 0) interval = 1;
      else if(repetitions === 1) interval = 3;
      else interval = Math.round(interval * ease);
      if(quality === 1){
        ease = Math.max(1.3, ease - 0.15);
        interval = Math.max(1, Math.round(interval*0.75));
      } else if(quality === 3){
        ease = ease + 0.15;
        interval = Math.round(interval*1.3);
      }
      repetitions += 1;
    }
    word.srs = { repetitions, interval, ease, dueDate: addDaysISO(todayISO(), interval) };
    word.history.push({date: todayISO(), quality});

    state.stats.totalReviews += 1;
    const last = state.stats.lastStudyDate;
    const today = todayISO();
    if(last !== today){
      if(last && daysBetween(last, today) === 1){
        state.stats.streak += 1;
      } else {
        state.stats.streak = 1;
      }
      state.stats.lastStudyDate = today;
    }
    saveState();
  }

  function dueLabel(word){
    const diff = daysBetween(todayISO(), word.srs.dueDate);
    if(diff < 0) return {text:'zaległe', cls:'due-overdue'};
    if(diff === 0) return {text:'dziś', cls:'due-today'};
    if(diff === 1) return {text:'jutro', cls:'due-soon'};
    return {text:'za '+diff+' dni', cls:'due-future'};
  }

  function sparkline(word){
    const w=64,h=22;
    const interval = Math.max(word.srs.interval,1);
    const lastReviewDate = word.history.length ? word.history[word.history.length-1].date : word.created;
    const daysSince = Math.max(0, daysBetween(lastReviewDate, todayISO()));
    const steps = 20;
    const pts = [];
    for(let i=0;i<=steps;i++){
      const t = (i/steps) * interval * 1.4;
      const strength = 100*Math.exp(-t/(interval*0.6));
      const x = (i/steps)*w;
      const y = h - (strength/100)*(h-3) - 1;
      pts.push(x.toFixed(1)+','+y.toFixed(1));
    }
    const path = 'M'+pts.join(' L');
    const ratio = Math.min(daysSince/(interval*1.4), 1);
    const markerX = ratio*w;
    const markerStrength = 100*Math.exp(-(ratio*interval*1.4)/(interval*0.6));
    const markerY = h - (markerStrength/100)*(h-3) - 1;
    const overdue = daysSince >= interval;
    const soon = daysSince >= interval*0.7;
    const color = overdue ? 'var(--rust)' : (soon ? 'var(--amber)' : 'var(--moss)');
    return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" class="sparkline">'+
      '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="1.5"/>'+
      '<circle cx="'+markerX.toFixed(1)+'" cy="'+markerY.toFixed(1)+'" r="2.2" fill="'+color+'"/>'+
      '</svg>';
  }

  // ---------- rendering: shell ----------
  function setTab(name){
    currentTab = name;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab===name));
    document.getElementById('tab-today').hidden = name!=='today';
    document.getElementById('tab-words').hidden = name!=='words';
    document.getElementById('tab-stats').hidden = name!=='stats';
    if(name==='today') renderToday();
    if(name==='words') renderWords();
    if(name==='stats') renderStats();
  }

  function refreshPills(){
    document.getElementById('dueCountPill').textContent = dueWords().length;
    document.getElementById('streakPill').textContent = state.stats.streak;
  }

  // ---------- Today tab ----------
  function renderToday(){
    refreshPills();
    const el = document.getElementById('tab-today');
    const due = dueWords();

    if(state.words.length === 0){
      el.innerHTML = '<div class="empty"><p>Nie masz jeszcze żadnych słówek.</p>'+
        '<button class="btn btn-primary" onclick="Lexicon.goAddWord()">Dodaj pierwsze słowo</button></div>';
      return;
    }

    let html = '';
    if(due.length === 0){
      html += '<div class="today-hero"><h2>Brak powtórek na dziś</h2>'+
        '<div class="sub">Wszystko na bieżąco — wróć jutro, albo poćwicz dodatkowo bez wpływu na harmonogram... '+
        'a właściwie: te powtórki też zaktualizują termin kolejnej sesji.</div>'+
        '<div class="cta-row">'+
        '<button class="btn btn-secondary" onclick="Lexicon.startReview(\'flashcard\', true)">Poćwicz dowolne fiszki</button>'+
        '<button class="btn btn-secondary" onclick="Lexicon.startReview(\'quiz\', true)">Poćwicz dowolny quiz</button>'+
        '</div></div>';
    } else {
      html += '<div class="today-hero">'+
        '<h2>'+due.length+' '+(due.length===1?'słowo czeka':'słów czeka')+' na powtórkę</h2>'+
        '<div class="sub">Wybierz tryb — oba aktualizują harmonogram powtórek.</div>'+
        '<div class="cta-row">'+
        '<button class="btn btn-primary" onclick="Lexicon.startReview(\'flashcard\')">Fiszki</button>'+
        '<button class="btn btn-secondary" onclick="Lexicon.startReview(\'quiz\')">Quiz</button>'+
        '</div>'+
        '<div class="due-preview">'+ due.slice(0,12).map(w=>'<span class="chip">'+escapeHtml(w.en)+'</span>').join('') + (due.length>12?'<span class="chip">+'+(due.length-12)+'</span>':'') +'</div>'+
        '</div>';
    }
    html += '<div class="curve-note">Harmonogram powtórek opiera się na krzywej zapominania Ebbinghausa: im lepiej znasz słowo (ocena „Dobrze"/„Łatwo"), tym dłuższa przerwa do kolejnej powtórki. Ocena „Znowu" resetuje odstęp do 1 dnia.</div>';
    el.innerHTML = html;
  }

  // ---------- Review session ----------
  function startReview(mode, useAll){
    reviewMode = mode;
    reviewQueue = shuffle(useAll ? state.words : dueWords());
    reviewIndex = 0;
    cardFlipped = false;
    currentQuizAnswered = false;
    if(reviewQueue.length === 0){ setTab('today'); return; }
    renderReviewStage();
  }

  function reviewStageContainer(){
    const el = document.getElementById('tab-today');
    return el;
  }

  function renderReviewStage(){
    const el = reviewStageContainer();
    if(reviewIndex >= reviewQueue.length){
      el.innerHTML = '<div class="review-stage review-complete">'+
        '<h2>Gotowe</h2>'+
        '<p>Przećwiczono '+reviewQueue.length+' '+(reviewQueue.length===1?'słowo':'słów')+'.</p>'+
        '<button class="btn btn-primary" onclick="Lexicon.setTab(\'today\')">Wróć</button>'+
        '</div>';
      refreshPills();
      return;
    }
    const word = reviewQueue[reviewIndex];
    let inner = '<div class="review-progress"><span>'+(reviewIndex+1)+' / '+reviewQueue.length+'</span>'+
      '<button onclick="Lexicon.setTab(\'today\')">Zakończ</button></div>';

    if(reviewMode === 'flashcard'){
      inner += renderFlashcardHtml(word);
    } else {
      inner += renderQuizHtml(word);
    }
    el.innerHTML = '<div class="review-stage">'+inner+'</div>';

    if(reviewMode === 'quiz'){
      const input = document.getElementById('quizInput');
      if(input){
        input.focus();
        input.addEventListener('keydown', function(e){
          if(e.key==='Enter'){
            e.preventDefault();
            if(!currentQuizAnswered) Lexicon.checkQuiz(); else Lexicon.nextReviewItem();
          }
        });
      }
    }
  }

  function renderFlashcardHtml(word){
    currentQuizDirection = Math.random() < 0.5 ? 'en-pl' : 'pl-en';
    const frontLang = 'en-pl' === currentQuizDirection ? 'EN' : 'PL';
    const frontWord = currentQuizDirection === 'en-pl' ? word.en : word.pl.split('/')[0].trim();
    const backLang = currentQuizDirection === 'en-pl' ? 'PL' : 'EN';
    const backWord = currentQuizDirection === 'en-pl' ? word.pl : word.en;

    let examplesHtml = '';
    if(word.examples && word.examples.length){
      examplesHtml = '<div class="card-examples">'+word.examples.map(ex =>
        '<div class="example-row"><span class="example-context">'+escapeHtml(ex.context||'')+'</span>'+escapeHtml(ex.sentence)+'</div>'
      ).join('')+'</div>';
    }

    return '<div class="flashcard" id="flashcardEl" onclick="Lexicon.flipCard()">'+
      '<div id="cardFrontFace">'+
        '<div class="card-lang">'+frontLang+'</div>'+
        '<div class="card-word">'+escapeHtml(frontWord)+'</div>'+
        '<div class="card-hint">Kliknij, aby zobaczyć tłumaczenie</div>'+
      '</div>'+
      '<div id="cardBackFace" style="display:none">'+
        '<div class="card-lang">'+backLang+'</div>'+
        '<div class="card-word">'+escapeHtml(backWord)+'</div>'+
        examplesHtml+
      '</div>'+
      '</div>'+
      '<div class="rate-row" id="rateRow" style="display:none">'+
        '<button class="rate rate-again" onclick="event.stopPropagation();Lexicon.rate(0)">Znowu<span>1 dz.</span></button>'+
        '<button class="rate rate-hard" onclick="event.stopPropagation();Lexicon.rate(1)">Trudne</button>'+
        '<button class="rate rate-good" onclick="event.stopPropagation();Lexicon.rate(2)">Dobrze</button>'+
        '<button class="rate rate-easy" onclick="event.stopPropagation();Lexicon.rate(3)">Łatwo</button>'+
      '</div>';
  }

  function flipCard(){
    if(cardFlipped) return;
    cardFlipped = true;
    document.getElementById('cardFrontFace').style.display = 'none';
    document.getElementById('cardBackFace').style.display = 'block';
    document.getElementById('rateRow').style.display = 'flex';
  }

  function rate(quality){
    const word = reviewQueue[reviewIndex];
    applyReview(word, quality);
    reviewIndex += 1;
    cardFlipped = false;
    renderReviewStage();
  }

  function renderQuizHtml(word){
    currentQuizAnswered = false;
    currentQuizDirection = Math.random() < 0.5 ? 'en-pl' : 'pl-en';
    const promptWord = currentQuizDirection === 'en-pl' ? word.en : word.pl.split('/')[0].trim();
    const langLabel = currentQuizDirection === 'en-pl' ? 'EN → PL' : 'PL → EN';
    return '<div class="quiz-lang">'+langLabel+'</div>'+
      '<div class="quiz-word">'+escapeHtml(promptWord)+'</div>'+
      '<div class="quiz-input-row">'+
        '<input type="text" id="quizInput" autocomplete="off" placeholder="Wpisz tłumaczenie...">'+
        '<button class="btn btn-primary" id="quizActionBtn" onclick="Lexicon.checkQuiz()">Sprawdź</button>'+
      '</div>'+
      '<div id="quizFeedback"></div>';
  }

  function checkQuiz(){
    if(currentQuizAnswered) return;
    const word = reviewQueue[reviewIndex];
    const input = document.getElementById('quizInput');
    const userAnswer = input.value;
    const target = currentQuizDirection === 'en-pl' ? word.pl : word.en;
    const accepted = acceptableAnswers(target);
    const correct = accepted.includes(normalize(userAnswer));
    currentQuizAnswered = true;

    let examplesHtml = '';
    if(word.examples && word.examples.length){
      examplesHtml = '<div class="quiz-examples">'+word.examples.map(ex =>
        '<div class="example-row"><span class="example-context">'+escapeHtml(ex.context||'')+'</span>'+escapeHtml(ex.sentence)+'</div>'
      ).join('')+'</div>';
    }

    const fb = document.getElementById('quizFeedback');
    fb.innerHTML = '<div class="quiz-feedback '+(correct?'correct':'incorrect')+'">'+
      '<div class="correct-answer">'+(correct?'Dobrze!':'Poprawna odpowiedź: ')+(correct?'':escapeHtml(target))+'</div>'+
      examplesHtml+
      '</div>';

    input.disabled = true;
    const btn = document.getElementById('quizActionBtn');
    btn.textContent = 'Dalej';
    btn.onclick = function(){ Lexicon.nextReviewItem(); };

    applyReview(word, correct ? 2 : 0);
    refreshPills();
  }

  function nextReviewItem(){
    reviewIndex += 1;
    renderReviewStage();
  }

  // ---------- Words tab ----------
  let searchTerm = '';
  function renderWords(){
    const el = document.getElementById('tab-words');
    const filtered = state.words.filter(w => {
      if(!searchTerm) return true;
      const t = searchTerm.toLowerCase();
      return w.en.toLowerCase().includes(t) || w.pl.toLowerCase().includes(t);
    });

    let html = '<div class="toolbar">'+
      '<input type="text" id="searchInput" placeholder="Szukaj słówka..." value="'+escapeHtml(searchTerm)+'">'+
      '<button class="btn btn-secondary" onclick="Lexicon.openBulkImport()">Dodaj wiele naraz</button>'+
      '<button class="btn btn-primary" onclick="Lexicon.openForm()">+ Dodaj słowo</button>'+
      '</div>';
    html += '<div id="formContainer"></div>';
    html += '<div id="bulkContainer"></div>';

    if(filtered.length === 0){
      html += '<div class="empty"><p>'+(state.words.length===0 ? 'Brak słówek — dodaj pierwsze.' : 'Nic nie pasuje do wyszukiwania.')+'</p></div>';
    } else {
      html += '<div class="word-list">'+ filtered.map(renderWordRow).join('') +'</div>';
    }
    el.innerHTML = html;

    document.getElementById('searchInput').addEventListener('input', function(e){
      searchTerm = e.target.value;
      renderWords();
      // restore focus + caret
      const inp = document.getElementById('searchInput');
      inp.focus();
      inp.setSelectionRange(searchTerm.length, searchTerm.length);
    });

    if(editingWordId !== null || formOpenFlag){
      renderWordForm();
    }
    if(bulkOpenFlag){
      renderBulkPanel();
    }
  }

  function renderWordRow(w){
    const badge = dueLabel(w);
    const tags = (w.examples||[]).map(e=>e.context).filter(Boolean);
    const uniqueTags = [...new Set(tags)];
    return '<div class="word-row">'+
      sparkline(w)+
      '<div class="pair">'+
        '<div class="en">'+escapeHtml(w.en)+' <span style="color:var(--text-dim);font-size:13px;">— '+escapeHtml(w.pl)+'</span></div>'+
        (uniqueTags.length ? '<div class="tags">'+uniqueTags.map(t=>'<span class="tag-mini">'+escapeHtml(t)+'</span>').join('')+'</div>' : '')+
      '</div>'+
      '<span class="due-badge '+badge.cls+'">'+badge.text+'</span>'+
      '<div class="row-actions">'+
        '<button class="icon-btn" title="Edytuj" onclick="Lexicon.editWord(\''+w.id+'\')">✎</button>'+
        '<button class="icon-btn" title="Usuń" onclick="Lexicon.deleteWord(\''+w.id+'\')">✕</button>'+
      '</div>'+
      '</div>';
  }

  let formOpenFlag = false;
  let draftExamples = [];

  function openForm(){
    editingWordId = null;
    draftExamples = [{context:'praca / IT', sentence:''},{context:'codzienne', sentence:''}];
    formOpenFlag = true;
    renderWords();
  }
  function editWord(id){
    const w = state.words.find(x=>x.id===id);
    if(!w) return;
    editingWordId = id;
    draftExamples = (w.examples||[]).map(e=>({...e}));
    if(draftExamples.length===0) draftExamples = [{context:'', sentence:''}];
    formOpenFlag = true;
    renderWords();
    setTimeout(()=>{
      document.getElementById('formEn').value = w.en;
      document.getElementById('formPl').value = w.pl;
      document.getElementById('formEn').scrollIntoView({behavior:'smooth', block:'center'});
    }, 0);
  }
  function closeForm(){
    formOpenFlag = false;
    editingWordId = null;
    renderWords();
  }
  function deleteWord(id){
    if(!confirm('Usunąć to słowo na stałe?')) return;
    state.words = state.words.filter(w=>w.id!==id);
    saveState();
    renderWords();
  }

  function renderWordForm(){
    const container = document.getElementById('formContainer');
    if(!container) return;
    const w = editingWordId ? state.words.find(x=>x.id===editingWordId) : null;
    let html = '<div class="word-form">'+
      '<h3>'+(editingWordId ? 'Edytuj słowo' : 'Nowe słowo')+'</h3>'+
      '<div class="form-row">'+
        '<div><label>Angielski</label><input type="text" id="formEn" placeholder="np. flaky test" value="'+(w?escapeHtml(w.en):'')+'"></div>'+
        '<div><label>Polski (można podać kilka wariantów przez /)</label><input type="text" id="formPl" placeholder="np. niestabilny test" value="'+(w?escapeHtml(w.pl):'')+'"></div>'+
      '</div>'+
      '<label>Przykłady użycia (różne konteksty)</label>'+
      '<div id="examplesEditor">'+ draftExamples.map((ex,i)=>renderExampleEditorRow(ex,i)).join('') +'</div>'+
      '<button class="btn-ghost" onclick="Lexicon.addExampleRow()">+ dodaj kontekst</button>'+
      '<div class="form-actions">'+
        '<button class="btn btn-primary" onclick="Lexicon.saveWord()">Zapisz</button>'+
        '<button class="btn btn-secondary" onclick="Lexicon.closeForm()">Anuluj</button>'+
      '</div>'+
      '</div>';
    container.innerHTML = html;
  }
  function renderExampleEditorRow(ex, i){
    return '<div class="example-editor-row">'+
      '<div class="ctx"><input type="text" list="ctxSuggestions" placeholder="kontekst" value="'+escapeHtml(ex.context||'')+'" onchange="Lexicon.updateDraftExample('+i+',\'context\',this.value)"></div>'+
      '<div class="sent"><input type="text" placeholder="zdanie po angielsku" value="'+escapeHtml(ex.sentence||'')+'" onchange="Lexicon.updateDraftExample('+i+',\'sentence\',this.value)"></div>'+
      '<button onclick="Lexicon.removeExampleRow('+i+')">✕</button>'+
      '</div>';
  }
  function addExampleRow(){
    draftExamples.push({context:'', sentence:''});
    renderWordForm();
  }
  function removeExampleRow(i){
    draftExamples.splice(i,1);
    if(draftExamples.length===0) draftExamples.push({context:'', sentence:''});
    renderWordForm();
  }
  function updateDraftExample(i, field, value){
    draftExamples[i][field] = value;
  }
  function saveWord(){
    const en = document.getElementById('formEn').value.trim();
    const pl = document.getElementById('formPl').value.trim();
    if(!en || !pl){ alert('Podaj słowo angielskie i polskie tłumaczenie.'); return; }
    const examples = draftExamples.filter(e => (e.sentence||'').trim().length>0)
      .map(e=>({context:(e.context||'').trim(), sentence:e.sentence.trim()}));

    if(editingWordId){
      const w = state.words.find(x=>x.id===editingWordId);
      w.en = en; w.pl = pl; w.examples = examples;
    } else {
      state.words.push(makeWord(en, pl, examples));
    }
    saveState();
    formOpenFlag = false;
    editingWordId = null;
    renderWords();
  }

  // ---------- Bulk import (AI generate + paste + URL sync) ----------
  let bulkOpenFlag = false;
  let bulkMode = 'ai'; // 'ai' | 'paste' | 'url'
  let bulkLoading = false;
  let bulkError = null;
  let bulkCandidates = [];
  let savedSourceUrl = '';

  function existingEnSet(){
    return new Set(state.words.map(w => normalize(w.en)));
  }

  function parseLinesToCandidates(text){
    const lines = (text||'').split('\n').map(l=>l.trim()).filter(Boolean);
    const existing = existingEnSet();
    const candidates = [];
    for(const line of lines){
      const parts = line.split('|').map(p=>p.trim());
      if(parts.length < 2 || !parts[0] || !parts[1]) continue;
      const en = parts[0];
      const pl = parts[1];
      const examples = [];
      for(let i=2;i<parts.length;i++){
        const seg = parts[i];
        if(!seg) continue;
        const idx = seg.indexOf(':');
        if(idx > -1){
          examples.push({context: seg.slice(0,idx).trim(), sentence: seg.slice(idx+1).trim()});
        } else {
          examples.push({context:'', sentence: seg});
        }
      }
      const dup = existing.has(normalize(en));
      candidates.push({en, pl, examples, selected: !dup, duplicate: dup});
    }
    return candidates;
  }

  function openBulkImport(){
    bulkOpenFlag = true;
    bulkCandidates = [];
    bulkError = null;
    renderWords();
  }
  function closeBulkImport(){
    bulkOpenFlag = false;
    bulkCandidates = [];
    bulkError = null;
    renderWords();
  }
  function setBulkMode(mode){
    bulkMode = mode;
    bulkCandidates = [];
    bulkError = null;
    renderBulkPanel();
  }

  async function generateWithAI(){
    const topicInput = document.getElementById('bulkTopic');
    const countInput = document.getElementById('bulkCount');
    const topic = topicInput ? topicInput.value.trim() : '';
    let count = countInput ? parseInt(countInput.value, 10) : 8;
    if(!count || count < 1) count = 8;
    if(count > 15) count = 15;
    if(!topic){ bulkError = 'Podaj temat, np. "code review" albo "spotkania statusowe".'; renderBulkPanel(); return; }

    bulkLoading = true;
    bulkError = null;
    renderBulkPanel();

    const existingList = state.words.map(w => w.en).join(', ');
    const prompt = 'Jesteś nauczycielem angielskiego dla polskiego specjalisty pracującego w IT (testy/QA). '+
      'Wygeneruj dokładnie '+count+' przydatnych angielskich słówek lub zwrotów na temat: "'+topic+'". '+
      'Unikaj słówek już znanych: '+(existingList || 'brak') + '. '+
      'Zwróć WYŁĄCZNIE poprawny JSON, bez markdown, bez dodatkowego tekstu, w formacie: '+
      '[{"en":"słowo po angielsku","pl":"polskie tłumaczenie (opcjonalnie 1-2 warianty oddzielone /)",'+
      '"examples":[{"context":"praca / IT albo codzienne","sentence":"przykładowe zdanie po angielsku"}]}]. '+
      'Dla każdego słowa podaj 1-2 przykładowe zdania, najlepiej w różnych kontekstach (praca/IT oraz codzienne).';

    try{
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 2000,
          messages: [{ role:'user', content: prompt }]
        })
      });
      if(!response.ok) throw new Error('HTTP '+response.status);
      const data = await response.json();
      const textBlock = (data.content || []).find(b => b.type === 'text');
      if(!textBlock) throw new Error('Brak treści w odpowiedzi');
      let clean = textBlock.text.trim();
      clean = clean.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
      const parsed = JSON.parse(clean);
      const existing = existingEnSet();
      bulkCandidates = parsed.filter(it => it && it.en && it.pl).map(it => {
        const dup = existing.has(normalize(it.en));
        return {
          en: String(it.en).trim(),
          pl: String(it.pl).trim(),
          examples: (it.examples||[]).map(e => ({context:String(e.context||'').trim(), sentence:String(e.sentence||'').trim()})).filter(e=>e.sentence),
          selected: !dup,
          duplicate: dup
        };
      });
      if(bulkCandidates.length === 0) bulkError = 'Model nie zwrócił żadnych słówek. Spróbuj innego tematu.';
    }catch(e){
      console.error('AI generate error', e);
      bulkError = 'Nie udało się wygenerować słówek (błąd sieci lub odpowiedzi). Spróbuj ponownie albo użyj wklejania tekstu.';
      bulkCandidates = [];
    }
    bulkLoading = false;
    renderBulkPanel();
  }

  function parseBulkText(){
    const area = document.getElementById('bulkPasteArea');
    const text = area ? area.value : '';
    bulkCandidates = parseLinesToCandidates(text);
    bulkError = bulkCandidates.length === 0 ? 'Nie znaleziono poprawnych wierszy. Format: angielski | polski | kontekst: zdanie' : null;
    renderBulkPanel();
  }

  async function fetchFromUrl(){
    const input = document.getElementById('bulkUrl');
    const url = input ? input.value.trim() : '';
    if(!url){ bulkError = 'Podaj adres URL pliku ze słówkami.'; renderBulkPanel(); return; }

    savedSourceUrl = url;
    try{ window.localStorage.setItem('vocab-source-url', url); }catch(e){ console.error('Could not save source URL', e); }

    bulkLoading = true;
    bulkError = null;
    renderBulkPanel();
    try{
      const res = await fetch(url, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const text = await res.text();
      bulkCandidates = parseLinesToCandidates(text);
      if(bulkCandidates.length === 0) bulkError = 'Plik pod tym adresem nie zawiera poprawnych wierszy (format: angielski | polski | kontekst: zdanie).';
    }catch(e){
      console.error('Fetch source error', e);
      bulkError = 'Nie udało się pobrać pliku. Sprawdź, czy adres jest publicznie dostępny (np. raw.githubusercontent.com) i poprawny.';
      bulkCandidates = [];
    }
    bulkLoading = false;
    renderBulkPanel();
  }

  function toggleBulkCandidate(i){
    bulkCandidates[i].selected = !bulkCandidates[i].selected;
  }

  function addBulkSelected(){
    const chosen = bulkCandidates.filter(c => c.selected);
    if(chosen.length === 0){ bulkError = 'Zaznacz przynajmniej jedno słowo.'; renderBulkPanel(); return; }
    chosen.forEach(c => {
      state.words.push(makeWord(c.en, c.pl, c.examples));
    });
    saveState();
    bulkOpenFlag = false;
    bulkCandidates = [];
    bulkError = null;
    renderWords();
  }

  function renderBulkPanel(){
    const container = document.getElementById('bulkContainer');
    if(!container) return;
    if(!bulkOpenFlag){ container.innerHTML=''; return; }

    let html = '<div class="word-form bulk-panel">'+
      '<h3>Dodaj wiele słówek naraz</h3>'+
      '<div class="bulk-toggle">'+
        '<button class="'+(bulkMode==='ai'?'active':'')+'" onclick="Lexicon.setBulkMode(\'ai\')">Wygeneruj (AI)</button>'+
        '<button class="'+(bulkMode==='paste'?'active':'')+'" onclick="Lexicon.setBulkMode(\'paste\')">Wklej tekst</button>'+
        '<button class="'+(bulkMode==='url'?'active':'')+'" onclick="Lexicon.setBulkMode(\'url\')">Synchronizuj z linku</button>'+
      '</div>';

    if(bulkMode === 'ai'){
      html += '<div class="form-row">'+
        '<div><label>Temat / kategoria</label><input type="text" id="bulkTopic" placeholder="np. code review, spotkania statusowe, phrasal verbs"></div>'+
        '<div style="max-width:110px"><label>Ile słów</label><input type="text" id="bulkCount" value="8"></div>'+
        '</div>'+
        '<button class="btn btn-primary" onclick="Lexicon.generateWithAI()" '+(bulkLoading?'disabled':'')+'>'+(bulkLoading?'Generuję…':'Generuj')+'</button>';
    } else if(bulkMode === 'paste'){
      html += '<label>Jeden wiersz na słowo: <span style="text-transform:none;">angielski | polski | kontekst: zdanie; kontekst2: zdanie2</span></label>'+
        '<textarea id="bulkPasteArea" rows="6" placeholder="flaky test | niestabilny test | praca / IT: This flaky test fails randomly.\nregression | regresja"></textarea>'+
        '<button class="btn btn-primary" style="margin-top:8px" onclick="Lexicon.parseBulkText()">Parsuj</button>';
    } else {
      html += '<label>Publiczny adres pliku tekstowego (np. surowy plik z GitHub — ten sam format co przy wklejaniu)</label>'+
        '<input type="text" id="bulkUrl" placeholder="https://raw.githubusercontent.com/uzytkownik/vocab-data/main/pending-words.txt" value="'+escapeHtml(savedSourceUrl)+'">'+
        '<button class="btn btn-primary" style="margin-top:8px" onclick="Lexicon.fetchFromUrl()" '+(bulkLoading?'disabled':'')+'>'+(bulkLoading?'Pobieram…':'Pobierz')+'</button>'+
        '<div class="curve-note" style="margin-top:12px;">Adres zapamiętam, więc następnym razem wystarczy jedno kliknięcie „Pobierz".</div>';
    }

    if(bulkError){
      html += '<div class="quiz-feedback incorrect" style="margin-top:14px;">'+escapeHtml(bulkError)+'</div>';
    }

    if(bulkCandidates.length){
      html += '<div class="bulk-preview">'+
        bulkCandidates.map((c,i) => renderBulkCandidateRow(c,i)).join('') +
        '</div>'+
        '<div class="form-actions">'+
        '<button class="btn btn-primary" onclick="Lexicon.addBulkSelected()">Dodaj zaznaczone ('+bulkCandidates.filter(c=>c.selected).length+')</button>'+
        '<button class="btn btn-secondary" onclick="Lexicon.closeBulkImport()">Anuluj</button>'+
        '</div>';
    } else {
      html += '<div class="form-actions"><button class="btn btn-secondary" onclick="Lexicon.closeBulkImport()">Zamknij</button></div>';
    }

    html += '</div>';
    container.innerHTML = html;
  }

  function renderBulkCandidateRow(c, i){
    const examplesHtml = c.examples.length ? '<div class="bulk-examples">'+c.examples.map(e=>
      '<div class="example-row"><span class="example-context">'+escapeHtml(e.context)+'</span>'+escapeHtml(e.sentence)+'</div>'
    ).join('')+'</div>' : '';
    return '<label class="bulk-row">'+
      '<input type="checkbox" '+(c.selected?'checked':'')+' onchange="Lexicon.toggleBulkCandidate('+i+')">'+
      '<div class="bulk-row-body">'+
        '<div class="en">'+escapeHtml(c.en)+' <span class="pl">— '+escapeHtml(c.pl)+'</span>'+(c.duplicate?' <span class="dup-flag">już w słowniku</span>':'')+'</div>'+
        examplesHtml+
      '</div>'+
      '</label>';
  }

  // ---------- Stats tab ----------
  function renderStats(){
    const el = document.getElementById('tab-stats');
    const total = state.words.length;
    const due = dueWords().length;
    const mastered = state.words.filter(w=>w.srs.interval>=21).length;
    const weakest = state.words.slice().sort((a,b)=>a.srs.ease-b.srs.ease).slice(0,5).filter(w=>w.history.length>0);

    let html = '<div class="stat-grid">'+
      statCard(total,'Wszystkich słów')+
      statCard(due,'Do powtórki dziś')+
      statCard(mastered,'Opanowanych (21+ dni)')+
      statCard(state.stats.streak,'Seria dni')+
      statCard(state.stats.totalReviews,'Powtórek łącznie')+
      '</div>';

    if(weakest.length){
      html += '<div class="panel-block"><h3>Warto poćwiczyć więcej</h3>'+
        weakest.map(w=>'<div class="weak-row"><span>'+escapeHtml(w.en)+' — '+escapeHtml(w.pl)+'</span><span class="ease">EF '+w.srs.ease.toFixed(2)+'</span></div>').join('')+
        '</div>';
    }

    html += '<div class="panel-block"><h3>Kopia zapasowa</h3>'+
      '<div class="sub" style="margin-bottom:10px">Dane są zapisywane automatycznie w tej przeglądarce (localStorage). '+
      'Rób też od czasu do czasu kopię do pliku — pozwoli odzyskać postępy po wyczyszczeniu danych przeglądarki albo przenieść je na inne urządzenie.'+
      (state.stats.lastBackup ? ' Ostatnia kopia: <strong>'+escapeHtml(state.stats.lastBackup)+'</strong>.' : ' Nie zrobiono jeszcze żadnej kopii.')+
      '</div>'+
      '<div class="cta-row">'+
      '<button class="btn btn-secondary" onclick="Lexicon.exportData()">Pobierz kopię (JSON)</button>'+
      '<button class="btn btn-secondary" onclick="Lexicon.triggerImport()">Wczytaj kopię (JSON)</button>'+
      '</div>'+
      '</div>';

    html += '<div class="panel-block danger-zone"><h3>Strefa niebezpieczna</h3>'+
      '<button class="btn btn-danger" onclick="Lexicon.resetAll()">Wyczyść wszystkie dane</button>'+
      '</div>';

    el.innerHTML = html;
  }
  function statCard(num,label){
    return '<div class="stat-card"><div class="num">'+num+'</div><div class="label">'+label+'</div></div>';
  }
  function exportData(){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'vocab-export-'+todayISO()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    state.stats.lastBackup = todayISO();
    saveState();
    renderStats();
  }

  function triggerImport(){
    document.getElementById('importFileInput').click();
  }

  async function handleImportFile(evt){
    const input = evt.target;
    const file = input.files && input.files[0];
    input.value = ''; // allow re-selecting the same file later
    if(!file) return;
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);
      if(!parsed || !Array.isArray(parsed.words) || typeof parsed.stats !== 'object' || !parsed.stats){
        alert('To nie wygląda na poprawny plik kopii zapasowej Lexicon (brak words/stats).');
        return;
      }
      const ok = confirm(
        'Wczytanie tego pliku ZASTĄPI obecne dane w przeglądarce.\n\n'+
        'Obecnie: '+state.words.length+' słów.\n'+
        'W pliku: '+parsed.words.length+' słów.\n\n'+
        'Kontynuować?'
      );
      if(!ok) return;
      state = parsed;
      if(!state.stats) state.stats = {streak:0,lastStudyDate:null,totalReviews:0};
      await saveState();
      setTab('stats');
      alert('Dane zostały wczytane z pliku.');
    }catch(e){
      console.error('Import failed', e);
      alert('Nie udało się wczytać pliku. Upewnij się, że to plik JSON wyeksportowany z tej aplikacji.');
    }
  }
  async function resetAll(){
    if(!confirm('To usunie wszystkie słówka i statystyki bezpowrotnie. Kontynuować?')) return;
    state = { words: [], stats:{streak:0,lastStudyDate:null,totalReviews:0} };
    await saveState();
    setTab('stats');
  }

  function goAddWord(){
    setTab('words');
    setTimeout(openForm, 0);
  }

  // ---------- init ----------
  async function init(){
    await loadState();
    requestPersistentStorage();
    try{
      const savedUrl = window.localStorage.getItem('vocab-source-url');
      if(savedUrl) savedSourceUrl = savedUrl;
    }catch(e){ /* not set yet — fine */ }
    document.getElementById('loadingState').hidden = true;
    document.querySelectorAll('.tab').forEach(btn=>{
      btn.addEventListener('click', ()=> setTab(btn.dataset.tab));
    });
    document.getElementById('importFileInput').addEventListener('change', handleImportFile);
    setTab('today');
  }

  window.Lexicon = {
    setTab, startReview, flipCard, rate, checkQuiz, nextReviewItem,
    openForm, editWord, closeForm, deleteWord, saveWord,
    addExampleRow, removeExampleRow, updateDraftExample,
    exportData, triggerImport, handleImportFile, resetAll, goAddWord,
    openBulkImport, closeBulkImport, setBulkMode, generateWithAI,
    parseBulkText, fetchFromUrl, toggleBulkCandidate, addBulkSelected
  };

  init();
})();
</script>
<datalist id="ctxSuggestions">
  <option value="praca / IT">
  <option value="codzienne">
  <option value="spotkanie">
  <option value="nieformalne">
</datalist>
</body>
